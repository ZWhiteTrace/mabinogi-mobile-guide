<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>瑪奇 Mobile 台版攻略筆記</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="瑪奇 Mobile 台港澳版攻略筆記：新手、進度規劃、世界王尾刀稱號、符文裝備、生活技能、易漏清單。非官方粉絲整理，每篇附來源與查證日期。">
  <link rel="stylesheet" href="vendor/vue.css">
  <style>
    :root {
      --theme-color: #e0559e;
      --bg: #121016;
      --surface: #191622;
      --surface-2: #1f1b2a;
      --text: #e6e1ea;
      --muted: #9c93a8;
      --accent: #e0559e;
      --accent-soft: rgba(224, 85, 158, .10);
      --gold: #e3bd6a;
      --border: #2d2739;
      --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }
    body {
      background:
        radial-gradient(1000px 380px at 75% -10%, rgba(224, 85, 158, .08), transparent 70%),
        var(--bg);
      background-attachment: fixed;
    }

    /* ── 側邊欄 ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    .sidebar > h1 { margin: 0 auto .6rem; }
    .sidebar > h1 a {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .1em;
      color: var(--gold);
    }
    .sidebar ul li a {
      color: var(--muted);
      font-size: 14px;
      border-radius: 999px;
      padding: 5px 12px;
      transition: color .15s ease, background .15s ease;
    }
    .sidebar ul li a:hover {
      color: var(--text);
      background: var(--accent-soft);
      text-decoration: none;
    }
    .sidebar ul li.active > a {
      color: var(--accent);
      background: var(--accent-soft);
      border-right: 0;
      font-weight: 600;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); }
    .sidebar-toggle { background: transparent; }
    .sidebar-toggle span { background-color: var(--accent); }

    /* ── 搜尋框 ── */
    .search { border-bottom: 1px solid var(--border) !important; }
    .search input {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
    }
    .search input::placeholder { color: var(--muted); }
    .search .results-panel { color: var(--text); }
    .search .matching-post { border-bottom: 1px solid var(--border); }
    .search h2 { color: var(--accent); font-size: 15px; }

    /* ── 內文 ── */
    .content { padding-top: 20px; }
    .markdown-section {
      max-width: 52em;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      animation: page-in .24s ease-out;
    }
    @keyframes page-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .markdown-section { animation: none; }
    }

    .markdown-section h1, .markdown-section h2,
    .markdown-section h3, .markdown-section h4 {
      font-weight: 700;
      color: var(--text);
      letter-spacing: .02em;
      text-wrap: balance;
    }
    .markdown-section h1 { font-size: 1.75rem; }
    .markdown-section h1::after {
      content: "";
      display: block;
      width: 2.4em;
      height: 3px;
      border-radius: 2px;
      margin-top: .5em;
      background: linear-gradient(90deg, var(--accent), rgba(224, 85, 158, 0));
    }
    .markdown-section h2 {
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: .35em;
      margin-top: 2.2em;
    }
    .markdown-section h3 { font-size: 1.05rem; color: var(--accent); }

    .markdown-section p, .markdown-section ul, .markdown-section ol { color: var(--text); }
    .markdown-section strong { color: var(--gold); font-weight: 600; }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted rgba(224, 85, 158, .45);
      transition: border-color .15s ease;
    }
    .markdown-section a:hover { border-bottom: 1px solid var(--accent); }
    .markdown-section a strong { color: var(--accent); }

    /* 引言 → 道具卡風格提示 */
    .markdown-section blockquote {
      margin: 1.4em 0;
      padding: .75em 1.15em;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 1px;
      border-radius: 12px;
      color: var(--muted);
    }
    .markdown-section blockquote p { margin: .3em 0; color: var(--muted); }

    /* 表格 → 圓角卡 */
    .markdown-section table {
      display: table;
      width: 100%;
      font-size: .92em;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .markdown-section th {
      background: var(--surface-2);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: .05em;
      border: 0;
      border-bottom: 1px solid var(--border);
      padding: .55em .85em;
    }
    .markdown-section td {
      border: 0;
      border-bottom: 1px solid var(--border);
      padding: .55em .85em;
    }
    .markdown-section tr:last-child td { border-bottom: 0; }
    .markdown-section tr { border: 0; }
    .markdown-section tr:nth-child(2n) { background: var(--accent-soft); }

    /* 行內代碼 → 藥丸標籤 */
    .markdown-section code {
      background: var(--surface-2);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: .85em;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .12em .55em;
    }
    .markdown-section pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .markdown-section pre > code {
      background: transparent;
      border: 0;
      color: var(--text);
    }

    .markdown-section hr { border-bottom: 1px solid var(--border); }
    .markdown-section em { color: var(--muted); }

    .github-corner svg { fill: var(--surface-2); color: var(--accent); }

    @media (max-width: 768px) {
      .markdown-section { font-size: 14px; }
      .markdown-section table { display: block; overflow-x: auto; }
      body.close .sidebar { background: var(--surface); }
    }

    ::selection { background: rgba(224, 85, 158, .3); }
  </style>
</head>
<body>
  <div id="app">載入中…</div>
  <script>
    window.$docsify = {
      name: '瑪奇 Mobile 攻略筆記',
      repo: 'ZWhiteTrace/mabinogi-mobile-guide',
      homepage: 'index.md',
      loadSidebar: true,
      subMaxLevel: 0,
      relativePath: true,
      auto2top: true,
      search: { placeholder: '搜尋筆記', noData: '沒有結果', depth: 2 }
    }
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
</body>
</html>
